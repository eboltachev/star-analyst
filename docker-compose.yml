services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./:/app
      - storage:/data/storage
    depends_on: [db]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  worker:
    build: .
    env_file: .env
    volumes:
      - ./:/app
      - storage:/data/storage
    depends_on: [db]
    command: python -m app.worker.run
volumes:
  pgdata:
  storage:
